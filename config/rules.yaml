# 确定性规则：命中直接产出 Intent，不调用模型。按顺序求值，首个命中即停。

rules:
  - id: dm-is-question
    # 只把真正的问句留在只读档；陈述/开发请求继续往下走分类器。
    when: { channel: dm, textMatches: '(\?|？|吗|怎么|为什么|是否|能否|可不可以|请问|如何|多少)' }
    then: { kind: question, suggestedAction: reply_only, confidence: 1 }

  - id: group-at-me
    when: { channel: group, atMe: true }
    then: { kind: dev-request, suggestedAction: dispatch_session, confidence: 0.9 }

  - id: allowlisted-group
    when: { channel: group, groupIn: allowlist }
    then: { kind: dev-request, confidence: 0.8 }

  - id: keyword-bug
    when: { channel: group, textMatches: '(bug|报错|异常|失败|修复)' }
    then: { kind: bug, suggestedAction: dispatch_session, confidence: 0.8 }

  - id: keyword-doc
    when: { textMatches: '(更新文档|补充说明|文档同步)' }
    then: { kind: doc-update, suggestedAction: update_doc, confidence: 0.8 }

allowlist:
  groups: []          # 填群 id
  people: []          # 填 userId
  keywords: []

# 未命中任何规则 → 交给 classifier-llm 判断；模型也不确定 → 只记录。
