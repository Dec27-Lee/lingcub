  - id: KERNEL-INT-010
    title: 消息事件与事件史同事务写入，重复投递不追加
    layer: integration
    priority: P0
    tags:
      - kernel
      - event
      - log
      - integration
    status: ready
    command: node --experimental-strip-types --test tests/specs/kernel/event-log.test.ts
    assertions:
      - 消息事件与事件史同事务写入，重复投递不追加
      - 领域事件同 id 只落一次
      - 新订阅默认不回放历史；since=beginning 才回放
      - 游标持久化：关库重开后只投剩下的
      - 全局串行：前一个订阅处理完才轮到下一个
      - 失败退避：未到点不重试，到点后重试成功
      - 死信越过游标：毒事件不卡后续，死信行保留
      - handler 超时按失败处理，不冻住整个 tick
      - 死信越过游标是持久化的：重开库不重投毒事件
      - 滞后超限冻结订阅；积压超上限跳过不补投
      - prune：只删游标前且无未决投递的事件；死信事件保留
      - 崩溃恢复：dispatched 回到 pending 且 attempts 不归零
    timeoutSec: 60
    file: tests/specs/kernel/event-log.test.ts
