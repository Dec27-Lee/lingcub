# kernel 套件：执行真相。runner 只读本文件；规范见 tests/README.md。
# 每条 scenario 对应一个可独立运行的测试文件，command 必须能直接跑通。
suite: kernel
domain: kernel
scenarios:
  - id: KERNEL-INT-001
    title: 效果由能力名家族决定：副作用不能声明成 none，插件不能用内核前缀
    layer: integration
    priority: P0
    tags:
      - kernel
      - capabilities
      - integration
    status: ready
    command: node --experimental-strip-types --test tests/specs/kernel/capabilities.test.ts
    assertions:
      - 效果由能力名家族决定：副作用不能声明成 none，插件不能用内核前缀
      - 能力重名直接失败
      - call：同步能力校验输入输出并记审计；副作用能力拒绝 call
      - 输出不合法也算失败并记审计
      - submit：无发件箱拒绝；有发件箱时收据幂等且只入队一次
      - check：needs 缺失要报，wants 缺失只降级
    timeoutSec: 60
    file: tests/specs/kernel/capabilities.test.ts
  - id: KERNEL-INT-002
    title: 九分支能力化：提交后的 Action 与旧 createDeliver 分支一一对应
    layer: integration
    priority: P1
    tags:
      - kernel
      - capability
      - effects
      - integration
    status: ready
    command: node --experimental-strip-types --test tests/specs/kernel/capability-effects.test.ts
    assertions:
