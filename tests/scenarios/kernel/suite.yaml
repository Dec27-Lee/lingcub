    file: tests/specs/kernel/capability-effects.test.ts
  - id: KERNEL-INT-003
    title: 状态卡：第一次是建卡，记下 message_id
    layer: integration
    priority: P1
    tags:
      - kernel
      - cards
      - integration
    status: ready
    command: node --experimental-strip-types --test tests/specs/kernel/cards.test.ts
    assertions:
      - 状态卡：第一次是建卡，记下 message_id
      - 状态卡：内容没变就不重发（不该刷屏）
      - 状态卡：内容变了就原地改同一张卡
      - 状态卡：频道不支持卡片时明确失败，不假装成功
      - 卡片渲染：状态决定颜色与标题，一行一个元素（参考项目 status 卡）
      - 卡片渲染：超长「你说」折成折叠面板，「它说」用灰字
      - 状态卡：建卡没拿到消息 id 就明确失败，不记成已建
      - 图片：投递前先下载，再把本地路径补进正文
      - 图片：没有 image 字段就不下载
      - 置顶：建卡后按配置置顶，置顶失败不影响发卡
      - 换卡：旧卡先取消置顶（否则记录一删就永远撤不掉）
      - 刷新状态卡时，会话真名（aiTitle）会替换掉「用户第一句话当标题」
    timeoutSec: 60
    notes: 另有 9 条断言见用例文件
    file: tests/specs/kernel/cards.test.ts
