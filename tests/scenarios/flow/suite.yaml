  - id: FLOW-INT-008
    title: 飞书事件映射：扁平字段 → Event，毫秒时间戳转 ISO，atMe 留空不猜
    layer: integration
    priority: P1
    tags:
      - flow
      - plugins
      - integration
    status: ready
    command: node --experimental-strip-types --test tests/specs/flow/plugins.test.ts
    assertions:
      - 飞书事件映射：扁平字段 → Event，毫秒时间戳转 ISO，atMe 留空不猜
      - 私聊（p2p）映射为 dm
      - 钉钉 +listen-im all-direct：没有 channelType 也按来源声明映射为 dm
      - 缺字段时不静默：返回缺失清单与 payload 顶层键
      - 时间戳兼容秒/毫秒/ISO，非法值回落到收到的时刻
      - 分类输出解析：纯 JSON / 事件包裹 / 代码围栏都能取到
      - 参数模板：占位替换，缺变量直接失败
      - claude 执行器：第二道门禁拦住不在允许根内的工作区
      - claude 执行器：没配预算就报错，不拿 0 当默认值
      - dsh 执行器：真起子进程、收集进度、退出即完成
      - 飞书频道：正文作为一段合法 JSON 传给 CLI（引号不破结构）
      - 飞书频道：没配 chatId 就报错，不往空处发
    timeoutSec: 60
    notes: 另有 6 条断言见用例文件
    file: tests/specs/flow/plugins.test.ts
