# flow 套件：执行真相。runner 只读本文件；规范见 tests/README.md。
# 每条 scenario 对应一个可独立运行的测试文件，command 必须能直接跑通。
suite: flow
domain: flow
scenarios:
  - id: FLOW-INT-001
    title: dsh 活会话会被采纳：executor=dsh、source=source-local-dsh，卡片当话题根并置顶
    layer: integration
    priority: P1
    tags:
      - flow
      - adopt
      - local
      - windows
      - integration
    status: ready
    command: node --experimental-strip-types --test tests/specs/flow/adopt-local-windows.test.ts
    assertions:
      - dsh 活会话会被采纳：executor=dsh、source=source-local-dsh，卡片当话题根并置顶
      - claude 行为不变：executor=claude、source=source-local-claude
      - adoptPerRun 对两种执行器合计生效：上限 1 时一轮只接 1 个，下一轮再接另一个
      - 已存在的 dsh 会话被标过 dead：窗口还活着就复活成 active
      - 配置里只有 claude 时不影响采纳（没配 dsh 策略不该把这一轮打挂）
      - session 头判定：子代理/编排会话不是用户窗口，判定不出来也不采纳
      - dsh listLiveSessions 剔除子代理会话，读不出头的也不采纳
      - 会话短 id：dsh 的 session- 前缀不能把 id 吃掉（否则所有 dsh 窗口撞成一个）
    timeoutSec: 60
    file: tests/specs/flow/adopt-local-windows.test.ts
