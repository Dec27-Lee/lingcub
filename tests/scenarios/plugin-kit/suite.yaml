  - id: KIT-UNIT-011
    title: claude 二进制识别：`.cmd` 壳和绝对路径也算，dsh 不算
    layer: unit
    priority: P2
    tags:
      - plugin-kit
      - internal
      - claude
      - unit
    status: ready
    command: node --experimental-strip-types --test tests/specs/plugin-kit/internal-claude.test.ts
    assertions:
      - claude 二进制识别：`.cmd` 壳和绝对路径也算，dsh 不算
      - 一次性调用带上 --session-id，并登记为平台内部会话
      - 已有 --session-id 时原样保留，不重复注入也不登记
      - 活会话列举剔掉平台自己的分析子进程，保留用户窗口
      - 一次性调用的入口标记：sdk-cli 不算用户窗口，cli / 空都算
      - 只保留用户窗口：内存登记与一次性调用都要剔掉，认不出的不误杀
    timeoutSec: 60
    file: tests/specs/plugin-kit/internal-claude.test.ts
