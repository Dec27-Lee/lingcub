      - 媒体提示清洗：图片占位符后的命令提示被去掉
      - 媒体提示清洗：视频/文件类占位符同样只留占位符
      - 媒体提示清洗：普通消息原样返回，不误删正文里的链接
      - 媒体提示清洗：提示和正文混排时保留正文
    timeoutSec: 60
    file: tests/specs/plugin-kit/dingtalk-text.test.ts
  - id: KIT-UNIT-007
    title: 工作区扫描：登记过的 + 转录里出现过的，且只在允许根之内
    layer: unit
    priority: P2
    tags:
      - plugin-kit
