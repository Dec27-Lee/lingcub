# plugin-kit 套件：执行真相。runner 只读本文件；规范见 tests/README.md。
# 每条 scenario 对应一个可独立运行的测试文件，command 必须能直接跑通。
suite: plugin-kit
domain: plugin-kit
scenarios:
  - id: KIT-UNIT-001
    title: 没装 cc-switch 时返回 null（不该影响没用这个工具的人）
    layer: unit
    priority: P2
    tags:
      - plugin-kit
      - cc
      - switch
      - unit
    status: ready
    command: node --experimental-strip-types --test tests/specs/plugin-kit/cc-switch.test.ts
    assertions:
      - 没装 cc-switch 时返回 null（不该影响没用这个工具的人）
      - 探查：解析通用配置与每个服务商的 commonConfigEnabled
      - 计划：只改通用配置与 commonConfigEnabled=false 的条目
      - hasHook：只有带 timeout 的才算装上（旧形状要升级）
      - 合并：保留别人的钩子与非钩子键，只替换同命令的条目
      - 落盘：写通用配置与独立条目，不碰 claude-desktop，且先备份
      - 进程检测：tasklist 里有 cc-switch.exe 才算在跑
    timeoutSec: 60
    file: tests/specs/plugin-kit/cc-switch.test.ts
  - id: KIT-UNIT-002
    title: agents --json：解析出全 uuid / cwd / busy-idle
    layer: unit
    priority: P2
    tags:
      - plugin-kit
      - claude
      - agents
      - unit
    status: ready
    command: node --experimental-strip-types --test tests/specs/plugin-kit/claude-agents.test.ts
    assertions:
      - agents --json：解析出全 uuid / cwd / busy-idle
      - agents --json：坏输入（非 JSON / 非数组 / 缺字段）一律跳过，不抛
      - agents --json：只列 allowRoots 内、且没过期的会话
      - agents --json：空数组（一个窗口都没开）退回兜底而不是报错
      - agents --json：从转录里读出入口标记，供上层排除一次性调用
    timeoutSec: 60
    file: tests/specs/plugin-kit/claude-agents.test.ts
  - id: KIT-UNIT-003
    title: 信任预置：把工作区标记成已信任，其它字段一字不动
    layer: unit
    priority: P2
    tags:
      - plugin-kit
      - claude
      - trust
      - unit
    status: ready
    command: node --experimental-strip-types --test tests/specs/plugin-kit/claude-trust.test.ts
    assertions:
      - 信任预置：把工作区标记成已信任，其它字段一字不动
      - 信任预置：已经信任过就不写文件（幂等，不制造备份噪音）
      - 信任预置：大小写不同也认同一个目录，不新建重复条目
      - 信任预置：配置文件不存在或坏了就抛错，不瞎写
      - 信任判定：未登记的 git 仓库要人工确认一次；登记后不用
      - 信任判定：纯文件夹不弹确认；带 .mcp.json / .claude 设置才弹
      - 信任预置：子目录与仓库根各写一条，其它项目不动
      - 信任键：Claude 记的是正斜杠写法（E:/a/b），反斜杠条目它不认
      - 信任判定：正斜杠条目也算已信任（否则列表会误报「首次要确认」）
    timeoutSec: 60
    file: tests/specs/plugin-kit/claude-trust.test.ts
  - id: KIT-UNIT-004
    title: 收窗：按 cc-launch-<前8位> 找到根进程，带 /T 连子孙一起关
    layer: unit
    priority: P2
    tags:
      - plugin-kit
      - claude
      - window
      - unit
    status: ready
    command: node --experimental-strip-types --test tests/specs/plugin-kit/claude-window.test.ts
    assertions:
      - 收窗：按 cc-launch-<前8位> 找到根进程，带 /T 连子孙一起关
      - 收窗：没找到进程就返回 0（窗口可能已经自己退了）
      - 收窗：非 Windows 直接返回 0，不执行任何命令
      - 开窗超时：会先收窗再报错，错误里说明可能是信任确认框
    timeoutSec: 60
    file: tests/specs/plugin-kit/claude-window.test.ts
  - id: KIT-UNIT-005
