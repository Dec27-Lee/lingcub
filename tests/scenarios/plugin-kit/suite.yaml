    assertions:
      - 工作区扫描：登记过的 + 转录里出现过的，且只在允许根之内
      - 允许根判断：根本身算在内，前缀相近但不同级的不算
      - 转录尾部取 cwd：只读尾巴也能拿到最后一条
    timeoutSec: 60
    file: tests/specs/plugin-kit/discover.test.ts
  - id: KIT-UNIT-008
    title: dsh 会话发现：读 projcache 的 cwd/标题，按 allowRoots 过滤
    layer: unit
    priority: P2
    tags:
      - plugin-kit
      - dsh
      - discover
      - unit
    status: ready
    command: node --experimental-strip-types --test tests/specs/plugin-kit/dsh-discover.test.ts
    assertions:
      - dsh 会话发现：读 projcache 的 cwd/标题，按 allowRoots 过滤
      - dsh 会话发现：文件新近更新的算在跑，旧的算历史
      - dsh 会话发现：超过 resumeDays 的会话不列
      - dsh 工作区：同一 cwd 只列一次，按最近活动排序
      - dsh 会话文件定位：找不到会话目录返回 undefined，不抛错
    timeoutSec: 60
    file: tests/specs/plugin-kit/dsh-discover.test.ts
  - id: KIT-UNIT-009
