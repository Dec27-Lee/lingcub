    title: 控制台金标：固定输入与基线逐字一致
    layer: integration
    priority: P1
    tags:
      - golden
      - integration
    status: ready
    command: node --experimental-strip-types --test tests/specs/golden/golden.test.ts
    assertions:
      - 控制台金标：固定输入与基线逐字一致
    timeoutSec: 60
    file: tests/specs/golden/golden.test.ts
